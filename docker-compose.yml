version: "3.9"

services:
  backend:
    container_name: api-backend
    build:
      context: ../Sistemas-Distribuidos/GerenciadorDeProdutos/GerenciadorDeProdutos/
      dockerfile: Dockerfile
    ports:
      - "5200:5200"
    environment:
      - ASPNETCORE_URLS=http://+:5200
    networks:
      - app-network
    restart: always

  frontend:
    container_name: angular-frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "32771:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: always

networks:
  app-network:
    driver: bridge
